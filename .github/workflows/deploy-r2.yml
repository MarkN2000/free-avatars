name: Cloudflare R2へ配信

on:
  push:
    branches:
      - main
    paths:
      - avatars/**
      - catalog.json
      - tools/Publish-R2.ps1
      - tools/Test-Repository.ps1
      - .github/workflows/deploy-r2.yml
  workflow_dispatch:

concurrency:
  group: free-avatars-r2-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: 成果物を検証して配信
    runs-on: ubuntu-24.04
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v6
        with:
          lfs: true
          persist-credentials: false

      - name: AWS CLIを確認
        run: aws --version

      - name: リポジトリを検証
        shell: pwsh
        run: ./tools/Test-Repository.ps1

      - name: Cloudflare R2へ配信
        shell: pwsh
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_EC2_METADATA_DISABLED: "true"
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: ./tools/Publish-R2.ps1 -BucketName free-avatars
